name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # mainへのマージごとに、Conventional Commitsからバージョンを採番する。
  # デプロイは手動のdeploy.ymlで行う。そのとき、採番済みのpackage.jsonのversionがビルドに入る
  release:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-cd.yml@v2.114.6
    with:
      enable_shared_release_config: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  # 新しいバージョンが採番されたときだけ、本番へデプロイする(docsやchoreではデプロイしない)。
  # releaseジョブがバージョン更新コミットをmainへ入れるため、github.shaではなく
  # release_commit_shaをデプロイする。そうしないと、画面のバージョンが1つ前のままになる
  deploy:
    needs: release
    if: success() && needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release.outputs.release_commit_sha }}
    secrets: inherit
