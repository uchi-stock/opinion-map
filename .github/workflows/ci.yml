name: CI
run-name: >-
  CI (${{ github.event_name == 'pull_request' && 'PR' || 'push-to-main' }})
  ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    name: "CI"
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.114.1
    with:
      # reusable-ci.ymlの必須入力。上のuses:のタグと必ず一致させる
      self_ref: v2.114.1
      # カバレッジの閾値は、実測(backend 約94%、frontend 約91%)に近い値から始め、80%の目標を下回らない範囲で上げていく(下げない)。
      # functions は、V8 の集計が揺れやすいので、判定の対象にしない
      packages: '[{"dir":"backend","node_version":"22","coverage_threshold":88,"coverage_metrics":"lines,statements,branches"},{"dir":"frontend","node_version":"22","build":true,"coverage_threshold":85,"coverage_metrics":"lines,statements,branches"}]'
      # CI単独でのマージは止める。広聴AI評価の完了を待つgate jobがマージする
      # （dev-standardsの「1 job per app」パターン、docs/cicd-pipeline-specification.md参照）
      enable_auto_merge: false
      # 静的チェック(dev-standardsの標準)。違反するコミットは、CIで止まる
      enable_standards_check: true
      # 秘密情報の検知(enable_secret_scan)は、gitleaks-action が組織のリポジトリでライセンスキーを要るため使わない。
      # 代わりに、下の secret-scan ジョブで gitleaks の CLI(OSS)を直接実行する(#97)
      enable_text_lint: true
      text_lint_paths: |
        docs/**/*.md
        README.md
        CLAUDE.md
        backend/README.md
        frontend/README.md
      enable_dead_link_check: true
      dead_link_check_paths: |
        docs/**/*.md
        README.md
        CLAUDE.md
        backend/README.md
        frontend/README.md
      # コードの重複。まず報告だけ(しきい値0)。実測は0.6%と低いので、しきい値は後で決める
      # 循環依存と越境 import の検知。TypeScript まで見る検査は、下の architecture ジョブで行う
      enable_architecture_check: true
      enable_duplication_check: true
      # 依存更新のPRに、更新の種類(major/minor/patch)と直接/間接のリスクの要約をコメントする
      enable_dependency_risk_summary: true
      duplication_threshold: 0
    secrets: inherit

  # eval配下を変更したPRだけ広聴AI評価を、kouchou-runner配下を変更したPRだけランナーのイメージの確認を実行する
  changes:
    name: "評価対象の変更を判定する"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      eval: ${{ steps.diff.outputs.eval }}
      runner: ${{ steps.diff.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 変更ファイルを調べる
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(eval/kouchou/|\.github/workflows/kouchou-eval\.yml$)'; then
            echo "eval=true" >> "$GITHUB_OUTPUT"
          else
            echo "eval=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(kouchou-runner/|\.github/workflows/runner-image\.yml$)'; then
            echo "runner=true" >> "$GITHUB_OUTPUT"
          else
            echo "runner=false" >> "$GITHUB_OUTPUT"
          fi

  eval:
    name: "広聴AI評価"
    needs: changes
    if: needs.changes.outputs.eval == 'true'
    uses: ./.github/workflows/kouchou-eval.yml
    secrets: inherit

  runner-image:
    name: "ランナーのイメージの確認"
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    uses: ./.github/workflows/runner-image.yml

  # 誤ってコミットされた秘密情報(APIキー、トークンなど)を検知する。
  # gitleaks-action は、組織のリポジトリでライセンスキーを要るため、OSS の gitleaks を直接実行する。
  # バイナリは、版を固定し、公開されているチェックサムで確かめてから使う。
  # PR は、base からの差分のコミットだけ。main への push は、push された範囲だけを調べる
  secret-scan:
    name: "秘密情報の検知"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks を取得して、チェックサムを確かめる
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: 秘密情報を調べる
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # 検知した値は、ログに出さない(--redact)
          if [ "$EVENT" = "pull_request" ]; then
            ./gitleaks detect --source . --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            ./gitleaks detect --source . --redact --no-banner --log-opts="${BEFORE_SHA}..HEAD"
          else
            ./gitleaks detect --source . --redact --no-banner
          fi

  # 循環依存と、frontend と backend の越境 import を検知する。
  # reusable-ci のアーキテクチャ検査は、TypeScript を解析するための typescript が無く、.ts を読まない。
  # そのため、typescript を足して実行する(dev-standards 側の修正を待つ間の代わり)
  architecture:
    name: "アーキテクチャ検査(TypeScript込み)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: dependency-cruiser を実行する
        run: npx --yes -p typescript@5 -p dependency-cruiser@16 depcruise --config dependency-cruiser.config.cjs --output-type err frontend backend

  # 実際の DynamoDB(DynamoDB Local)に対して、保存先の契約と、並行の競合を確かめる。
  # 本物の DynamoDB の挙動(条件付き書き込み、トランザクション、GSI)の違いで壊れるのを、デプロイの前に見つける
  dynamodb-local:
    name: "DynamoDB Localでの検証"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: 依存パッケージをインストールする
        working-directory: backend
        run: npm ci
      - name: DynamoDB Local の起動を待つ
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000; then exit 0; fi
            sleep 2
          done
          echo "::error::DynamoDB Local が起動しませんでした"
          exit 1
      - name: 保存先の契約テストを実行する
        working-directory: backend
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: npx vitest run test/dynamoLocal.test.ts

  # Renovate(依存の更新)のPRは、自動ではマージしない。リスクの要約を見て、人が判断してマージする。
  # CI・評価・イメージの確認が成功してからマージする。評価とイメージの確認は、対象外ならスキップを成功とみなす
  gate:
    name: "自動マージ"
    needs: [ci, changes, eval, runner-image, dynamodb-local, architecture, secret-scan]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      needs.ci.result == 'success' &&
      needs.changes.result == 'success' &&
      needs.dynamodb-local.result == 'success' &&
      needs.architecture.result == 'success' &&
      needs.secret-scan.result == 'success' &&
      (needs.eval.result == 'success' || needs.eval.result == 'skipped') &&
      (needs.runner-image.result == 'success' || needs.runner-image.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: merge-queue-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: bamiyanapp/dev-standards/.github/actions/merge-pr@v2.114.1
        with:
          github-token: ${{ secrets.BOT_TOKEN != '' && secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
