# 一時的な調査用。確認が済んだら削除する(#122)
name: 診断(招待URL)
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      SITE: https://dq63ds5qh9abj.cloudfront.net
      EVENT_ID: fb801418-68b1-400c-9073-d8080284c08d
    steps:
      - name: 公開APIを呼ぶ
        run: |
          {
            echo "### 公開API"
            code=$(curl -sS -o body.json -w '%{http_code}' "$SITE/api/events/$EVENT_ID/public" || true)
            echo "status: $code"
            python3 - <<'PY'
          import json
          try:
              d = json.load(open("body.json"))
          except Exception as e:
              print("本文を読めない:", e); raise SystemExit
          if "sessions" in d:
              print("event.name を除く要約:", {k: d[k] for k in ("openSessionIds", "currentSessionId") if k in d})
              for s in d["sessions"]:
                  print({k: s.get(k) for k in ("status", "isOpen", "acceptingOpinions", "opinionCount", "viewers")})
          else:
              print(json.dumps(d, ensure_ascii=False)[:300])
          PY
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: DynamoDB のイベントとテーマの状態を見る(タイトルなどの本文は出さない)
        run: |
          {
            echo "### DynamoDB"
            table=$(aws cloudformation describe-stack-resources --stack-name opinion-map-prod \
              --query "StackResources[?ResourceType=='AWS::DynamoDB::Table'].PhysicalResourceId | [0]" --output text)
            echo "table: $table"
            aws dynamodb get-item --table-name "$table" --key "{\"pk\":{\"S\":\"EVENT#$EVENT_ID\"}}" --output json > event.json || true
            aws dynamodb scan --table-name "$table" --filter-expression "begins_with(pk, :p)" \
              --expression-attribute-values '{":p":{"S":"SESSION#"}}' --output json > sessions.json || true
            python3 - <<'PY'
          import json
          EVENT_ID = "fb801418-68b1-400c-9073-d8080284c08d"
          def plain(v):
              if isinstance(v, dict) and len(v) == 1:
                  k, x = next(iter(v.items()))
                  if k == "S": return x
                  if k == "N": return float(x)
                  if k == "BOOL": return x
                  if k == "NULL": return None
                  if k == "M": return {a: plain(b) for a, b in x.items()}
                  if k == "L": return [plain(b) for b in x]
              return v
          def data(item):
              d = plain(item.get("data")) if "data" in item else {}
              if isinstance(d, str):
                  d = json.loads(d)
              return d or {}
          ev = json.load(open("event.json")).get("Item")
          if not ev:
              print("イベントが DynamoDB に無い")
          else:
              d = data(ev)
              print("event:", {k: d.get(k) for k in ("status", "openSessionIds", "currentSessionId", "acceptingProposals")})
          rows = [data(i) for i in json.load(open("sessions.json")).get("Items", [])]
          mine = [r for r in rows if r.get("eventId") == EVENT_ID]
          print("このイベントのテーマ数:", len(mine), "/ 全テーマ数:", len(rows))
          for r in mine:
              print({k: r.get(k) for k in ("status", "format", "showOpinionsToParticipants")})
          PY
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
