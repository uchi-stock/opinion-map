name: 広聴AI評価
run-name: 広聴AI評価 (${{ github.event.inputs.note || 'manual' }})

on:
  # CI(ci.yml)から呼び出す。評価の完了を待ってからPRをマージするため、
  # このworkflow単独のpull_requestトリガーは持たない
  workflow_call:
  workflow_dispatch:
    inputs:
      note:
        description: 実行メモ（任意）
        required: false
        default: ""

permissions:
  contents: read

jobs:
  evaluate:
    name: "サンプル意見を分析する"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: APIキーの有無を確認する
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Secrets に GEMINI_API_KEY が設定されていません。"
            exit 1
          fi
      - name: 広聴AIの分析パッケージを入れる
        # PyPI版(0.1.x)は新しいgoogle-genaiの埋め込み応答に未対応のため、
        # 対応済みのmainのコミットを固定して入れる。
        # polars 2.0ではread_csvの引数(missing_utf8_is_empty_string)が使えず
        # 集計で失敗するため、1.xに固定する
        run: >-
          pip install
          'kouchou-ai-analysis-core[gemini,embeddings,clustering] @
          git+https://github.com/digitaldemocracy2030/kouchou-ai.git@7fff37a486bbc9e6f7b8c646e58b1aea5a99b95b#subdirectory=packages/analysis-core'
          'polars<2'
      - name: Geminiに1回だけ問い合わせて状態を診断する
        # 広聴AIのログにはレート制限の詳細が出ないため、同じモデルで直接確認する。
        # APIキーは出力しない（エラー本文にも含まれない）
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          from google import genai
          model = json.load(open("eval/kouchou/config.json"))["model"]
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          try:
              r = client.models.generate_content(model=model, contents="OKとだけ答えてください")
              print("OK:", model, (r.text or "")[:40])
          except Exception as e:
              print("ERROR:", model, getattr(e, "code", None), str(e)[:800])
          PY
      - name: 実行計画を確認する
        run: >-
          kouchou-analyze
          --config eval/kouchou/config.json
          --input-dir eval/kouchou/inputs
          --output-dir eval/kouchou/outputs
          --dry-run
      - name: 分析を実行する
        run: >-
          kouchou-analyze
          --config eval/kouchou/config.json
          --input-dir eval/kouchou/inputs
          --output-dir eval/kouchou/outputs
      - name: 結果をJob Summaryに出す
        run: |
          RESULT=$(find eval/kouchou/outputs -name hierarchical_result.json | head -1)
          if [ -z "$RESULT" ]; then
            echo "::error::hierarchical_result.json が見つかりません。"
            exit 1
          fi
          python eval/kouchou/summarize.py "$RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: 出力一式を保存する
        uses: actions/upload-artifact@v7
        with:
          name: kouchou-outputs
          path: eval/kouchou/outputs
