name: 分析基盤の動作確認
run-name: 分析基盤の動作確認 (${{ github.sha }})

# デプロイ済みの広聴AIのランナー(Fargate)を、サンプルの入力で1回動かして確かめる。
# アプリの認証は通さず、S3 と ECS を直接使う。入力は、こちらで作ったサンプル(eval/kouchou/inputs/sample.csv)だけ。
# 確かめること: イメージを取得できる / タスクが起動して終わる / 結果が S3 に置かれる / 未分類をアプリのコードで算出できる
# 必要な Secrets: AWS_ACCESS_KEY_ID、AWS_SECRET_ACCESS_KEY(デプロイと同じ)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-analysis
  cancel-in-progress: false

jobs:
  verify:
    name: "動かして確かめる"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      STACK_NAME: opinion-map-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: スタックの出力と、ネットワークを調べる
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs" --output json)
          get() { echo "$outputs" | jq -r --arg k "$1" '.[] | select(.OutputKey==$k) | .OutputValue'; }
          vpc=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text)
          {
            echo "BUCKET=$(get AnalysisBucketName)"
            echo "CLUSTER=$(get AnalysisClusterName)"
            echo "TASK_DEF=$(get RunnerTaskDefinitionArn)"
            echo "SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" Name=default-for-az,Values=true --query "Subnets[].SubnetId" --output text | tr '\t' ',')"
            echo "SG=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$vpc" Name=group-name,Values=default --query "SecurityGroups[0].GroupId" --output text)"
            echo "PREFIX=analysis/verify-${{ github.run_id }}"
          } >> "$GITHUB_ENV"

      - name: サンプルの入力を置く
        run: |
          # アプリが作る設定と同じ形にする(階層ごとのクラスタ数は、40件向けの [4, 8])
          cp eval/kouchou/inputs/sample.csv /tmp/input.csv
          jq '.input = "input"' eval/kouchou/config.json > /tmp/config.json
          aws s3 cp /tmp/input.csv "s3://${BUCKET}/${PREFIX}/input.csv"
          aws s3 cp /tmp/config.json "s3://${BUCKET}/${PREFIX}/config.json"

      - name: タスクを起動して、終わるのを待つ
        run: |
          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" --task-definition "$TASK_DEF" --launch-type FARGATE --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SG}],assignPublicIp=ENABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"runner\",\"environment\":[{\"name\":\"ANALYSIS_PREFIX\",\"value\":\"${PREFIX}\"}]}]}" \
            --query "tasks[0].taskArn" --output text)
          echo "TASK_ARN=$task_arn" >> "$GITHUB_ENV"
          echo "タスク: $task_arn"
          start=$(date +%s)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn" || true
          echo "TASK_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: タスクの結果を確かめる
        run: |
          info=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query "tasks[0].{stop:stopCode,reason:stoppedReason,exit:containers[0].exitCode}" --output json)
          echo "停止: $info"
          {
            echo "## 分析基盤の動作確認"
            echo ""
            echo "- タスクの実行時間(起動待ちを含む): ${TASK_SECONDS} 秒"
            echo "- 停止の情報: \`$info\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if aws s3 cp "s3://${BUCKET}/${PREFIX}/result.json" /tmp/result.json 2>/dev/null; then
            echo "- ✅ 結果(result.json)が S3 に置かれた" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ 結果が置かれなかった" >> "$GITHUB_STEP_SUMMARY"
            if aws s3 cp "s3://${BUCKET}/${PREFIX}/error.json" /tmp/error.json 2>/dev/null; then
              echo "- 失敗の理由: $(jq -r .summary /tmp/error.json)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

      - name: 結果を、アプリのコードで読む(未分類の算出)
        run: |
          npx --yes tsx@4.19.2 eval/kouchou/check-unclassified.ts /tmp/result.json eval/kouchou/inputs/sample.csv | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 置いたものを消す
        if: always()
        run: aws s3 rm "s3://${BUCKET}/${PREFIX}/" --recursive || true
