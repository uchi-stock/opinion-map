# Opinion Map の本番構成(API Gateway + Lambda + DynamoDB、S3 + CloudFront)。
# 1つのスタックにまとめる。CloudFront が、同じドメインで、画面(S3)と API(/api/*)を配信する。
# 同じドメインなので、CORS の設定は要らない。
# デプロイ: npm run bundle のあとに、npx osls deploy(.github/workflows/cd.yml のdeploy jobが行う)
service: opinion-map

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'ap-northeast-1'}
  stage: ${opt:stage, 'prod'}
  architecture: arm64
  memorySize: 512
  timeout: 29
  httpApi:
    payload: "2.0"
  environment:
    TABLE_NAME: !Ref Table
    # CloudFront が /api/* を転送するため、先頭の /api を取り除いて処理する
    API_PREFIX: /api
    # オーナーのログイン。GitHub の Secrets・Variables から渡す
    # Googleアカウントでのログイン(GOOGLE_CLIENT_ID・SESSION_SECRET・OWNER_EMAILS の3つが揃うと有効)
    GOOGLE_CLIENT_ID: ${env:GOOGLE_OAUTH_CLIENT_ID, ''}
    SESSION_SECRET: ${env:SESSION_SECRET, ''}
    OWNER_EMAILS: ${env:OWNER_EMAILS, ''}
    # 合言葉でのログイン(任意)。Googleログインを使うなら、なくてよい
    ADMIN_TOKEN: ${env:ADMIN_TOKEN, ''}
    # 共通点・相違点・問いの案に使う。なければ、そのAPIは使えない(503)
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    ANALYSIS_DAILY_LIMIT: ${env:ANALYSIS_DAILY_LIMIT, ''}
    INSIGHT_DAILY_LIMIT: ${env:INSIGHT_DAILY_LIMIT, ''}
    # 広聴AIをFargateで動かす設定。サブネットとセキュリティグループは、デプロイのワークフローが
    # 既定のVPCから調べて渡す。空なら、分析のAPIは使えない(503)
    ANALYSIS_BUCKET: !Ref AnalysisBucket
    ANALYSIS_CLUSTER: !Ref AnalysisCluster
    ANALYSIS_TASK_DEFINITION: !Ref RunnerTaskDefinition
    ANALYSIS_CONTAINER: runner
    ANALYSIS_SUBNETS: ${env:TASK_SUBNETS, ''}
    ANALYSIS_SECURITY_GROUPS: ${env:TASK_SECURITY_GROUP, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          # TransactWriteItems は、中身の操作(Put・Delete)の権限で許可される
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt Table.Arn
            - !Sub "${Table.Arn}/index/gsi1"
        # 分析のタスクを起動し、状態を見る。入力と結果は S3 で受け渡す
        - Effect: Allow
          Action:
            - ecs:RunTask
          Resource: !Ref RunnerTaskDefinition
          Condition:
            ArnEquals:
              ecs:cluster: !GetAtt AnalysisCluster.Arn
        - Effect: Allow
          Action:
            - ecs:DescribeTasks
          Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${AnalysisCluster}/*"
        - Effect: Allow
          Action:
            - iam:PassRole
          Resource:
            - !GetAtt RunnerExecutionRole.Arn
            - !GetAtt RunnerTaskRole.Arn
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: !Sub "${AnalysisBucket.Arn}/analysis/*"

package:
  patterns:
    - "!**"
    - dist-lambda/handler.mjs

functions:
  api:
    handler: dist-lambda/handler.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY

resources:
  Resources:
    Table:
      Type: AWS::DynamoDB::Table
      # データを失わないよう、スタックを消しても残す
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        # テーブル名は固定しない。作成の失敗などで残ったテーブルと、名前がぶつかるのを避ける
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: gsi1
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        # 分析のロックの失効に使う
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # --- 広聴AIの分析(Fargate のタスクを、分析1回ごとに起動する) ---

    # 入力(投稿の本文を含む)と結果の受け渡し用。取り込んだらアプリが消す。消し忘れに備え、2日で消える
    AnalysisBucket:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - Id: expire-analysis-objects
              Status: Enabled
              Prefix: analysis/
              ExpirationInDays: 2

    RunnerRepository:
      Type: AWS::ECR::Repository
      Properties:
        RepositoryName: ${self:service}-${self:provider.stage}-runner
        EmptyOnDelete: true
        ImageScanningConfiguration:
          ScanOnPush: true
        LifecyclePolicy:
          LifecyclePolicyText: |
            {"rules":[{"rulePriority":1,"description":"keep last 5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}

    AnalysisCluster:
      Type: AWS::ECS::Cluster
      Properties:
        ClusterName: ${self:service}-${self:provider.stage}

    # ログに投稿の本文は出さない設計だが、念のため短く保つ
    RunnerLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /ecs/${self:service}-${self:provider.stage}-runner
        RetentionInDays: 7

    # イメージの取得とログの書き込みに使う
    RunnerExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

    # タスクの中のプログラムが使う権限。分析用のバケットの中だけ
    RunnerTaskRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: analysis-bucket
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                  Resource: !Sub "${AnalysisBucket.Arn}/analysis/*"

    RunnerTaskDefinition:
      Type: AWS::ECS::TaskDefinition
      Properties:
        Family: ${self:service}-${self:provider.stage}-runner
        RequiresCompatibilities:
          - FARGATE
        NetworkMode: awsvpc
        Cpu: "2048"
        Memory: "4096"
        ExecutionRoleArn: !GetAtt RunnerExecutionRole.Arn
        TaskRoleArn: !GetAtt RunnerTaskRole.Arn
        RuntimePlatform:
          CpuArchitecture: X86_64
          OperatingSystemFamily: LINUX
        ContainerDefinitions:
          - Name: runner
            Image: !Sub "${RunnerRepository.RepositoryUri}:latest"
            Essential: true
            Environment:
              - Name: ANALYSIS_BUCKET
                Value: !Ref AnalysisBucket
              - Name: GEMINI_API_KEY
                Value: ${env:GEMINI_API_KEY, ''}
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: !Ref RunnerLogGroup
                awslogs-region: !Ref AWS::Region
                awslogs-stream-prefix: runner

    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    FrontendOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:provider.stage}-frontend
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    # 画面のパス(/s/<ID> や /admin など)を、index.html で返す。
    # CloudFront のエラーレスポンスで 404 を置き換える方式は、API の 404 も置き換えてしまうため、使わない
    SpaRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${self:provider.stage}-spa-rewrite
        AutoPublish: true
        FunctionConfig:
          Comment: 拡張子のないパスを index.html にする
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var last = request.uri.split('/').pop();
            if (last.indexOf('.') === -1) {
              request.uri = '/index.html';
            }
            return request;
          }

    # セキュリティ用のヘッダー。CSP は付けない(Google ログインのスクリプトを読み込むため)
    SecurityHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-${self:provider.stage}-security-headers
          SecurityHeadersConfig:
            StrictTransportSecurity:
              AccessControlMaxAgeSec: 31536000
              IncludeSubdomains: true
              Override: true
            ContentTypeOptions:
              Override: true
            FrameOptions:
              FrameOption: DENY
              Override: true
            ReferrerPolicy:
              ReferrerPolicy: strict-origin-when-cross-origin
              Override: true

    # API 用のオリジンへの転送。Host 以外のヘッダー(Authorization を含む)とクエリを、そのまま転送する。
    # Host を転送すると、API Gateway が受け付けない
    ApiOriginRequestPolicy:
      Type: AWS::CloudFront::OriginRequestPolicy
      Properties:
        OriginRequestPolicyConfig:
          Name: ${self:service}-${self:provider.stage}-api-origin
          HeadersConfig:
            HeaderBehavior: allExcept
            Headers:
              - Host
          QueryStringsConfig:
            QueryStringBehavior: all
          CookiesConfig:
            CookieBehavior: none

    Distribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:service}-${self:provider.stage}
          DefaultRootObject: index.html
          HttpVersion: http2and3
          PriceClass: PriceClass_200
          Origins:
            - Id: FrontendOrigin
              DomainName: !GetAtt FrontendBucket.RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""
              OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            - Id: ApiOrigin
              DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols:
                  - TLSv1.2
          DefaultCacheBehavior:
            TargetOriginId: FrontendOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            # マネージドポリシー: CachingOptimized
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
          CacheBehaviors:
            - PathPattern: api/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              # マネージドポリシー: CachingDisabled(APIは保存しない)
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy

    # CloudFront(このディストリビューション)からの読み取りだけを許可する
    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref FrontendBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${FrontendBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  Outputs:
    SiteUrl:
      Value: !Sub "https://${Distribution.DomainName}"
    FrontendBucketName:
      Value: !Ref FrontendBucket
    DistributionId:
      Value: !Ref Distribution
    TableName:
      Value: !Ref Table
    RunnerRepositoryUri:
      Value: !GetAtt RunnerRepository.RepositoryUri
    AnalysisClusterName:
      Value: !Ref AnalysisCluster
    AnalysisBucketName:
      Value: !Ref AnalysisBucket
    RunnerTaskDefinitionArn:
      Value: !Ref RunnerTaskDefinition
